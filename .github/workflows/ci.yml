# LumiScript — CI (v2.0.0)
#
# Runs the full build pipeline + test suite on every push and PR. The
# `bun run build` script chains typecheck:scripts + typecheck + typecheck:test
# before the three bundle builds, so a single green CI run gates: source
# typecheck, test typecheck, all three minified bundles emit, and 2300+
# tests pass.
#
# Catches regressions before tagged releases — particularly useful given
# that one previously-undetected typecheck:test failure had silently masked
# bundle rebuilds for an entire RC cycle (see notes/ post-mortem). With CI
# in place, future drift surfaces immediately.

name: CI

on:
  push:
    branches: [master, staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (typechecks + bundles)
        run: bun run build

      # The build chain regenerates the in-VM library bundles (gen:vm-libs) plus a
      # source-graph manifest that hashes each bundle's raw transitive inputs. If a
      # vm-lib SOURCE changed without re-running gen:vm-libs, the recomputed manifest
      # diverges from the committed one — fail loud so a stale QuickJS bundle can't
      # ship. We diff the MANIFEST, not the minified bundles: bun's minifier output
      # varies across versions (CI tracks `canary`), so a byte-diff on the bundles
      # themselves flakes on every toolchain bump, whereas the manifest hashes source
      # content and is bundler-independent.
      - name: Check VM-library bundles are in sync with their sources
        run: git diff --exit-code src/script-runner/generated/vm-libs.manifest.json

      - name: Lint (type-aware async-safety rules)
        run: bun run lint

      - name: Test
        run: bun test
