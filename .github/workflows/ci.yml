# LumiScript — CI (v1.0.0-rc.7+, audit F-M3)
#
# Runs the full build pipeline + test suite on every push and PR. The
# `bun run build` script chains typecheck:scripts + typecheck + typecheck:test
# before the three bundle builds, so a single green CI run gates: source
# typecheck, test typecheck, all three minified bundles emit, and 2300+
# tests pass.
#
# Catches regressions before tagged releases — particularly useful given
# that one previously-undetected typecheck:test failure had silently masked
# bundle rebuilds for an entire RC cycle (see notes/ post-mortem). With CI
# in place, future drift surfaces immediately.

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Intentionally tracks the rolling `canary` tag to match the dev's
          # local bun (installed via `bun upgrade --canary`, currently 1.4.x).
          # CAVEAT: `canary` is a SINGLE rolling GitHub release that Bun
          # overwrites on every commit to main — a moving target. A newer canary
          # can change async scheduling, so timing-sensitive tests MUST stay
          # scheduler-robust (e.g. the script-runner e2e ack handshake defers the
          # simulated frontend echo to a macrotask — see e2e-*-handle*.test.ts).
          # A SPECIFIC canary build cannot be pinned here (Bun publishes no
          # per-nightly tags); if determinism is ever needed over channel-
          # matching, switch to an exact stable, e.g. `bun-version: 1.3.14`.
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (typechecks + bundles)
        run: bun run build

      - name: Test
        run: bun test
